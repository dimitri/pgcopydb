services:
  source:
    image: postgres-wal2json:${PGVERSION:-16}-bullseye
    build:
      context: .
      dockerfile: Dockerfile.pg
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c wal_level=logical
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  target:
    image: postgres:${PGVERSION:-16}
    expose:
      - 5432
    env_file:
      - ../postgres.env
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

  netblock:
    build:
      context: .
      dockerfile: Dockerfile.netblock
    network_mode: "service:target"
    cap_add:
      - NET_ADMIN
    volumes:
      - follow-target-reconnect:/var/run/pgcopydb
    depends_on:
      - target

  inject:
    build:
      context: .
      dockerfile: Dockerfile.inject
    user: "0"
    env_file:
      - ../uris.env
      - ../paths.env
    volumes:
      - follow-target-reconnect:/var/run/pgcopydb
    depends_on:
      - netblock

  test:
    image: follow-target-reconnect
    build: .
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    environment:
      PGCOPYDB_TABLE_JOBS: 4
      PGCOPYDB_INDEX_JOBS: 2
    env_file:
      - ../uris.env
      - ../paths.env
    # share TMPDIR between inject and test services
    volumes:
      - follow-target-reconnect:/var/run/pgcopydb
    depends_on:
      - source
      - target
      - inject

volumes:
  follow-target-reconnect:
    external: true
